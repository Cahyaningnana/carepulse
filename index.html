<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarePulse AI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--navy:#0b2f57;--blue:#2a6ab0;--green:#3f9e52;--mint:#eaf6f1;--sky:#eef5fc;--ink:#14263d;--mut:#5d7088;--line:#dbe6f0;--red:#d93a3a;--amber:#e8920c;--ok:#2f9e57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(160deg,#f3f9fc,#eaf6f1 60%,#f6fbff);color:var(--ink);min-height:100vh}
h1,h2,h3{margin:0;color:var(--navy);letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
.logo{height:46px;display:block}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px #2a6ab04d}
.btn.g{background:linear-gradient(135deg,var(--green),#2d8a4a)}
.btn.o{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.r{background:linear-gradient(135deg,#e24a4a,#b82525)}
.btn.s{padding:7px 12px;font-size:13px;border-radius:9px}
.card{background:#fffffff2;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #0b2f570d}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700}
.SAFE,.Completed,.Normal{background:#dff5e6;color:#1d7a3e}.CAUTIOUS,.Pending,.Caution{background:#fdeccb;color:#a35f00}.EMERGENCY,.Missed,.Critical,.Emergency{background:#fbdcdc;color:#b02222}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:#fffffff0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);flex-wrap:wrap}
.top nav{display:flex;gap:4px;flex-wrap:wrap}.top nav a{padding:8px 12px;border-radius:10px;color:var(--navy);text-decoration:none;font-weight:600;font-size:14px}
.top nav a:hover{background:var(--sky)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}
.side{background:#fffffff2;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:67px;height:calc(100vh - 67px);overflow:auto}
.side a{display:block;padding:11px 14px;margin-bottom:3px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.side a:hover{background:var(--sky)}.side a.on{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff}
.main{padding:26px;max-width:1100px;width:100%}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;overflow-x:auto;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-right:0;z-index:30}.side a{white-space:nowrap;margin:0;font-size:12px;padding:9px 11px}.main{padding:16px 14px 90px}.top{padding:8px 14px}.top nav{display:none}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:56px 24px;max-width:1150px;margin:auto}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding:30px 16px}}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.05;font-weight:800;color:var(--navy)}
.hero p{font-size:18px;color:var(--mut);line-height:1.6;max-width:520px}
.ecg{width:100%;background:#fff;border-radius:24px;border:1px solid var(--line);padding:28px;box-shadow:0 20px 50px #0b2f5718}
.ecg svg path.l{stroke-dasharray:600;animation:dash 2.6s linear infinite}
@keyframes dash{from{stroke-dashoffset:600}to{stroke-dashoffset:-600}}
.beat{width:14px;height:14px;border-radius:50%;background:var(--green);animation:beat 1.2s infinite;display:inline-block}
@keyframes beat{0%{box-shadow:0 0 0 0 #3f9e5266}70%{box-shadow:0 0 0 14px #3f9e5200}100%{box-shadow:0 0 0 0 #3f9e5200}}
.feat{padding:0 24px 40px;max-width:1150px;margin:auto}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px;color:var(--navy)}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #2a6ab033;border-color:var(--blue)}
.err{color:var(--red);font-size:13px;margin-top:5px}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 16px}
.opt{display:flex;gap:8px;flex-wrap:wrap}.opt button{padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;color:var(--ink)}
.opt button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ring{--p:80;--c:var(--ok);width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#e3edf5 0);display:grid;place-items:center;transition:all .8s}
.ring b{width:98px;height:98px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;color:var(--navy)}
.status{display:flex;gap:22px;align-items:center;flex-wrap:wrap;color:#fff;border-radius:22px;padding:24px}
.s-SAFE{background:linear-gradient(135deg,#2f9e57,#1c6e8c)}.s-CAUTIOUS{background:linear-gradient(135deg,#e8920c,#c4630a)}.s-EMERGENCY{background:linear-gradient(135deg,#e24a4a,#a81f1f);animation:em 1.4s infinite}
@keyframes em{50%{box-shadow:0 0 0 10px #e24a4a30}}
.status h2{color:#fff;font-size:30px}
.tl{border-left:3px solid var(--line);margin-left:8px;padding-left:18px}.tl>div{position:relative;margin-bottom:14px}.tl>div:before{content:'';position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--blue)}
.toast{position:fixed;right:18px;bottom:90px;background:var(--navy);color:#fff;padding:13px 18px;border-radius:12px;z-index:99;animation:in .3s;max-width:320px}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.modal{position:fixed;inset:0;background:#0b2f5780;display:grid;place-items:center;z-index:90;padding:16px}.modal .card{max-width:460px;width:100%}
.skel{height:90px;border-radius:16px;background:linear-gradient(90deg,#e8f0f6,#f6fafd,#e8f0f6);background-size:200% 100%;animation:sk 1s infinite}
@keyframes sk{to{background-position:-200% 0}}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;display:grid;place-items:center;font-weight:800}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid #dbe6f0;border-top-color:var(--green);animation:sp 1s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(360deg)}}
.dis{font-size:13px;color:var(--mut);border-left:4px solid var(--blue);padding:8px 12px;background:var(--sky);border-radius:8px;margin-top:16px}
.unread{border-left:4px solid var(--blue)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const call=n=>modal(`<h3>Calling ${n}</h3><p class="mut">Prototype only: no real call is placed. Dial your local emergency number in a real emergency.</p>`);
const dir=n=>modal(`<h3>Directions to ${n}</h3><p class="mut">Prototype: a maps app would open here with turn-by-turn directions.</p>`);

/* ---------- public ---------- */
function header(){return `<div class="top"><a href="#/"><img class="logo" src="${LOGO}" alt="CarePulse AI"></a><nav><a href="#/">Home</a><a href="#/#how">How it works</a><a href="#/#features">Features</a><a href="#/team-register">Healthcare team</a><a href="#/emergency" style="color:var(--red)">Emergency</a></nav><div class="row"><button class="btn o s" onclick="go('/start')">Login</button><button class="btn s" onclick="go('/start')">Get started</button></div></div>`}
function landing(){return header()+`<section class="hero"><div><span class="pill SAFE"><span class="beat" style="width:8px;height:8px;margin-right:6px"></span>Daily health checks, decision support</span><h1 style="margin-top:16px">Your Health. Monitored. Understood. Protected.</h1><p>CarePulse AI helps you check your health daily, understand potential risks, and connect with nearby healthcare support when you need it.</p><div class="row" style="margin-top:22px"><button class="btn g" onclick="go('/start')">Start Health Check</button><button class="btn o" onclick="go('/team-register')">Join as Health Team</button></div></div>
<div class="ecg"><div class="row sp"><b style="color:var(--navy)">Live pulse (demo)</b><span class="pill SAFE">SAFE</span></div>${ECG}<div class="grid g3" style="gap:10px"><div class="card" style="padding:12px"><div class="mut">Heart rate</div><b style="font-size:22px">72 bpm</b></div><div class="card" style="padding:12px"><div class="mut">SpO₂</div><b style="font-size:22px">98%</b></div><div class="card" style="padding:12px"><div class="mut">Score</div><b style="font-size:22px">86</b></div></div></div></section>
<section class="feat" id="how"><h2 style="margin-bottom:14px">How it works</h2><div class="grid g3"><div class="card"><h3>1. Answer a short check</h3><p class="mut">Tell us how you feel in about a minute.</p></div><div class="card"><h3>2. Get a risk category</h3><p class="mut">Safe, Cautious or Emergency, with clear next steps.</p></div><div class="card"><h3>3. Reach support</h3><p class="mut">Hospitals, ambulances and certified nurses in one place.</p></div></div></section>
<section class="feat" id="features"><h2 style="margin-bottom:14px">Features</h2><div class="grid g3"><div class="card"><h3>🩺 Daily AI health check</h3><p class="mut">Decision support, not a diagnosis.</p></div><div class="card"><h3>⏱ Hourly patient monitoring</h3><p class="mut">Nurse schedules with reminders and status.</p></div><div class="card"><h3>🚑 Emergency access</h3><p class="mut">One tap to ambulances and the nearest hospital.</p></div></div><p class="dis">CarePulse AI provides decision support and does not replace professional medical diagnosis or emergency services. All data in this prototype is fictional.</p></section>`}
function start(){return header()+`<div style="max-width:440px;margin:40px auto;padding:0 16px"><div class="card" style="text-align:center"><img class="logo" style="margin:0 auto 12px;height:64px" src="${LOGO}" alt=""><h2>Welcome to CarePulse AI</h2><p class="mut">Enter your email to securely continue.</p><div style="text-align:left"><label>Email address</label><input id="em" type="email" placeholder="you@example.com"><div class="err" id="er"></div></div><button class="btn" style="width:100%;margin-top:16px" id="cont">Continue</button><p class="mut" style="margin-top:20px">Are you a healthcare professional?</p><button class="btn o" onclick="go('/team-register')">Register as Health Team</button><p class="mut" style="margin-top:14px;font-size:12px">Demo shortcut: use <a href="#" onclick="event.preventDefault();teamLogin()">nurse@carepulse.demo</a> for the Health Team view.</p></div></div>`}
function teamLogin(){S.role='team';S.email='nurse@carepulse.demo';S.user={name:'Sana Iqbal'};go('/t/dashboard')}
function bindStart(){$('#cont').onclick=()=>{const v=$('#em').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){$('#er').textContent='Enter a valid email address, like name@example.com.';return}if(v==='nurse@carepulse.demo')return teamLogin();S.email=v;S.role='user';go('/profile-setup')}}
function profileSetup(){return header()+`<div style="max-width:760px;margin:30px auto;padding:0 16px"><div class="card"><h2>Set up your health profile</h2><p class="mut">Your health information is handled securely and is only used to provide personalized health assistance.</p><div class="form2"><div><label>Full name</label><input id="p1" value=""></div><div><label>Email</label><input value="${S.email}" disabled></div><div><label>Phone number</label><input></div><div><label>Date of birth</label><input type="date"></div><div><label>Gender</label><select><option>Female</option><option>Male</option><option>Other</option></select></div><div><label>Emergency contact</label><input></div><div><label>Blood group</label><select><option>O+</option><option>A+</option><option>B+</option><option>AB+</option><option>O-</option></select></div><div><label>Allergies</label><input></div></div><label>Existing medical conditions</label><textarea rows="2"></textarea><label>Current medications</label><textarea rows="2"></textarea><div class="err" id="er"></div><button class="btn g" style="margin-top:16px" id="sv">Save profile</button></div></div>`}
function teamReg(){return header()+`<div style="max-width:800px;margin:30px auto;padding:0 16px"><div class="card"><h2>Join the CarePulse Health Team</h2><p class="mut">Certified healthcare professionals can register to monitor assigned patients and provide scheduled checkups.</p><div class="form2"><div><label>Full name</label><input></div><div><label>Email</label><input type="email"></div><div><label>Phone</label><input></div><div><label>Professional role</label><select><option>Nurse</option><option>Certified Caregiver</option><option>Healthcare Professional</option></select></div><div><label>License / certification number</label><input></div><div><label>Years of experience</label><input type="number" min="0"></div><div><label>Specialization</label><input></div><div><label>Hospital / organization</label><input></div><div><label>Availability</label><select><option>Mornings</option><option>Evenings</option><option>Nights</option><option>Full time</option></select></div><div><label>Location</label><input></div></div><label>Upload certification</label><input type="file" id="fl"><div class="row" style="margin-top:16px"><button class="btn g" id="tr">Submit for verification</button></div></div></div>`}
function emergencyPub(){return header()+`<div style="max-width:700px;margin:30px auto;padding:0 16px">${emBlock()}</div>`}
function emBlock(){return `<div class="status s-EMERGENCY"><div style="font-size:54px">🔴</div><div><h2>EMERGENCY</h2><p style="margin:6px 0 0">Please seek professional medical assistance immediately.</p></div></div><div class="grid g2" style="margin-top:14px"><button class="btn r" onclick="call('Emergency Services')">Call Emergency Services</button><button class="btn r" onclick="reqAmb(AMB[0][0])">Request Ambulance</button><button class="btn o" onclick="go('/hospitals')">Find Nearest Hospital</button><button class="btn o" onclick="go('/nurses')">Contact Health Team</button></div>`}

/* ---------- shell ---------- */
const UN=[['dashboard','Dashboard'],['check','Health Check'],['history','Health History'],['hospitals','Hospitals'],['ambulances','Ambulances'],['nurses','Nurses'],['notifications','Notifications'],['settings','Settings']];
const TN=[['t/dashboard','Dashboard'],['t/patients','Patients'],['t/schedule','Checkup Schedule'],['t/alerts','Alerts'],['t/history','Patient History'],['t/messages','Messages'],['settings','Settings']];
function shell(route,body){const nav=S.role==='team'?TN:UN;const unread=S.notes.filter(n=>n.u).length;
return `<div class="top"><a href="#/${S.role==='team'?'t/dashboard':'dashboard'}"><img class="logo" src="${LOGO}" alt="CarePulse AI"></a><div class="row"><button class="btn o s" onclick="go('/notifications')">🔔 ${unread}</button><div class="av" title="${S.user.name}">${S.user.name[0]}</div></div></div><div class="shell"><aside class="side">${nav.map(([r,l])=>`<a href="#/${r}" class="${route===r?'on':''}">${l}</a>`).join('')}<a href="#/" onclick="S.role=null">Logout</a></aside><main class="main">${body}</main></div>`}
const last=()=>S.checks[0];
function dash(){const c=last();const g=new Date().getHours()<12?'Morning':new Date().getHours()<17?'Afternoon':'Evening';
return `<h2>Good ${g}, ${S.user.name}</h2><p class="mut">${new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>
<div class="status s-${c.st}" style="margin:16px 0"><div class="ring" style="--p:${c.score};--c:#fff;background:conic-gradient(#fff ${c.score}%,#ffffff40 0)"><b style="color:var(--navy)">${c.score}</b></div><div style="flex:1;min-width:200px"><div style="opacity:.85;font-size:13px;font-weight:700">TODAY'S HEALTH STATUS</div><h2>${ico[c.st]} ${c.st}</h2><p style="margin:4px 0 12px">${c.st==='SAFE'?'Your latest check indicates no immediate warning signs.':c.st==='CAUTIOUS'?'Some answers suggest you should monitor your condition.':'Seek immediate medical assistance.'}</p><button class="btn" style="background:#fff;color:var(--navy)" onclick="go('/check')">Start New Health Check</button></div></div>
<div class="grid g2"><div class="card"><h3>Daily Health Check</h3><p class="mut">Last check: ${c.d}, ${c.t}<br>Next check: Today, 06:00 PM</p><div class="row sp">${pill(c.st)}<b>Score ${c.score}</b></div><button class="btn g s" style="margin-top:12px" onclick="go('/check')">Check now</button></div>
<div class="card"><h3>Ambulance Services</h3>${AMB.slice(0,2).map(a=>`<div class="row sp" style="margin-top:10px"><div><b>${a[0]}</b><div class="mut">${a[1]} · ETA ${a[3]}</div></div><button class="btn r s" onclick="reqAmb('${a[0]}')">Call</button></div>`).join('')}</div></div>
<h3 style="margin:22px 0 10px">Nearby Hospitals</h3><div class="grid g2">${HOSP.slice(0,2).map(hCard).join('')}</div>
<h3 style="margin:22px 0 10px">Certified Nurses</h3><div class="grid g3">${NUR.filter(n=>n[7]).map(nCard).join('')}</div>`}
const hCard=(h,i)=>`<div class="card"><div class="row sp"><h3>${h[0]}</h3>${h[3]?'<span class="pill EMERGENCY">ER</span>':''}</div><p class="mut">${h[1]} · ${h[2]}<br>${h[6]}<br>${h[5]}<br>${h[4]}</p><div class="row"><button class="btn s" onclick="hosp(${HOSP.indexOf(h)})">View details</button><button class="btn o s" onclick="dir('${h[0]}')">Get directions</button><button class="btn o s" onclick="call('${h[0]}')">Call</button></div></div>`;
const nCard=n=>`<div class="card"><div class="row"><div class="av">${n[0][0]}</div><div><b>${n[0]}</b> ${n[7]?'<span class="pill SAFE">✓ Verified</span>':'<span class="pill CAUTIOUS">Verification Pending</span>'}<div class="mut">${n[1]}</div></div></div><p class="mut">${n[2]} · ${n[3]} yrs · ⭐ ${n[5]}<br>${n[4]} · ${n[6]}</p><div class="row"><button class="btn o s" onclick="nurse('${n[0]}')">View profile</button><button class="btn g s" onclick="reqNurse('${n[0]}')">Request assistance</button></div></div>`;
function hosp(i){const h=HOSP[i];modal(`<h3>${h[0]}</h3><p class="mut">${h[6]}<br>${h[2]} · ${h[1]}<br>Services: ${h[5]}<br>${h[4]}</p>`)}
function reqAmb(n){modal(`<h3>🚑 Ambulance Request Sent</h3><p><b>${n}</b> is on the way.</p><p style="font-size:20px;font-weight:800;color:var(--green)">Estimated Arrival: 8 minutes</p><p class="mut">Prototype simulation. In a real emergency call your local emergency number.</p>`);S.notes.unshift({m:'Ambulance update: '+n+' dispatched, ETA 8 min',u:1})}
function reqNurse(n){toast('Assistance request sent to '+n);S.notes.unshift({m:n+' received your request',u:1})}
function nurse(n){const x=NUR.find(a=>a[0]===n);modal(`<h3>${x[0]}</h3><p class="mut">${x[1]} · ${x[2]}<br>${x[3]} years experience · ${x[6]}<br>Availability: ${x[4]} · Rating ${x[5]}<br>Assigned patients: 3<br>Review: "Calm, thorough and on time." (demo)</p><button class="btn g" onclick="reqNurse('${n}')">Request Nurse</button>`)}
function hospitals(){return `<h2>Nearby Hospitals</h2><p class="mut">Fictional demo directory.</p><div class="card" style="margin:14px 0;background:linear-gradient(135deg,#dff0f8,#e3f5ea);height:120px;display:grid;place-items:center">📍 Map view (prototype) · ${HOSP.length} hospitals within 6 km</div><div class="grid g2">${HOSP.map(hCard).join('')}</div>`}
function ambulances(){return `<h2>Ambulance Services</h2><div class="grid g2" style="margin-top:14px">${AMB.map(a=>`<div class="card"><div class="row sp"><h3>${a[0]}</h3>${pill(a[2]==='Available'?'SAFE':'CAUTIOUS').replace(/>[A-Z]+</,'>'+a[2]+'<')}</div><p class="mut">${a[1]} · ETA ${a[3]}<br>${a[4]}<br>Emergency available: ${a[2]==='Available'?'Yes':'Limited'}</p><button class="btn r" onclick="reqAmb('${a[0]}')">Request Ambulance</button></div>`).join('')}</div>`}
function nurses(){return `<h2>Certified Nurses</h2><div class="grid g2" style="margin-top:14px">${NUR.map(nCard).join('')}</div>`}
function notifs(){const h=`<h2>Notifications</h2><button class="btn o s" style="margin:10px 0" onclick="S.notes.forEach(n=>n.u=0);render()">Mark all read</button>`;return h+S.notes.map((n,i)=>`<div class="card ${n.u?'unread':''}" style="margin-bottom:10px;padding:14px" onclick="S.notes[${i}].u=0;render()">${n.u?'<b>':''}${n.m}${n.u?'</b>':''}</div>`).join('')}

/* ---------- health check ---------- */
const Q={feel:'Good',pain:'No',sev:0,breath:'No',dizzy:'No',fever:'No',weak:'No',chest:'No',other:''};let step=0;
const yn=(k)=>`<div class="opt">${['No','Mild','Yes'].map(v=>`<button class="${Q[k]===v?'on':''}" onclick="Q['${k}']='${v}';render()">${v}</button>`).join('')}</div>`;
const STEPS=[()=>`<h3>How are you feeling?</h3><div class="opt">${['Good','Okay','Unwell','Very unwell'].map(v=>`<button class="${Q.feel===v?'on':''}" onclick="Q.feel='${v}';render()">${v}</button>`).join('')}</div>`,
()=>`<h3>Do you have pain?</h3><div class="opt">${['No','Head','Chest','Stomach','Back','Limbs'].map(v=>`<button class="${Q.pain===v?'on':''}" onclick="Q.pain='${v}';render()">${v}</button>`).join('')}</div><label>How severe is the pain? <b id="sv">${Q.sev}</b>/10</label><input type="range" min="0" max="10" value="${Q.sev}" oninput="Q.sev=+this.value;$('#sv').textContent=this.value">`,
()=>`<h3>Do you have difficulty breathing?</h3>${yn('breath')}<h3 style="margin-top:20px">Chest discomfort?</h3>${yn('chest')}`,
()=>`<h3>Dizziness?</h3>${yn('dizzy')}<h3 style="margin-top:20px">Fever?</h3>${yn('fever')}<h3 style="margin-top:20px">Unusually weak?</h3>${yn('weak')}`,
()=>`<h3>Any other symptoms?</h3><textarea rows="3" id="oth" oninput="Q.other=this.value">${Q.other}</textarea>`];
function check(){return `<h2>How are you feeling today?</h2><p class="mut">Step ${step+1} of ${STEPS.length}</p><div style="height:8px;background:#e3edf5;border-radius:9px;margin:10px 0 18px"><div style="height:8px;width:${(step+1)/STEPS.length*100}%;background:var(--green);border-radius:9px;transition:.4s"></div></div><div class="card">${STEPS[step]()}<div class="row sp" style="margin-top:22px"><button class="btn o" ${step?'':'disabled style="opacity:.4"'} onclick="step--;render()">Back</button><button class="btn g" onclick="${step<STEPS.length-1?'step++;render()':'analyze()'}">${step<STEPS.length-1?'Next':'Get assessment'}</button></div></div><p class="dis">CarePulse AI provides decision support and does not replace professional medical diagnosis or emergency services.</p>`}
function assess(){let s=100;const v=x=>x==='Yes'?1:x==='Mild'?.5:0;const f={Good:0,Okay:8,Unwell:20,'Very unwell':32}[Q.feel];s-=f+Q.sev*2.5+v(Q.breath)*28+v(Q.chest)*30+v(Q.dizzy)*10+v(Q.fever)*10+v(Q.weak)*8;s=Math.max(5,Math.round(s));
let st='SAFE';if(s<75||Q.sev>=4||Q.dizzy!=='No'||Q.fever!=='No')st='CAUTIOUS';
if(Q.chest==='Yes'||Q.breath==='Yes'||(Q.sev>=8&&Q.pain!=='No')||s<40)st='EMERGENCY';
if(Q.chest==='Mild'&&Q.breath!=='No')st='EMERGENCY';return{s,st}}
let result=null;
function analyze(){result='loading';go('/result');setTimeout(()=>{result=assess();const sy=[Q.pain!=='No'?Q.pain+' pain':'',Q.breath!=='No'?'Breathing difficulty':'',Q.chest!=='No'?'Chest discomfort':'',Q.dizzy!=='No'?'Dizziness':'',Q.fever!=='No'?'Fever':'',Q.weak!=='No'?'Weakness':'',Q.other].filter(Boolean).join(', ')||'None';S.checks.unshift({d:new Date().toISOString().slice(0,10),t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),sym:sy,score:result.s,st:result.st,n:''});step=0;render()},2200)}
function resultV(){if(result==='loading'||!result)return `<h2>CarePulse AI Assessment</h2><div class="card" style="text-align:center;margin-top:16px;padding:50px"><div class="spin"></div><p class="mut" style="margin-top:20px">Reviewing your answers…</p>${ECG}</div>`;
const m={SAFE:'Based on the information you provided, no immediate warning signs were identified.',CAUTIOUS:'Some information suggests that you should monitor your condition and consider contacting a healthcare professional.',EMERGENCY:'Your responses indicate potentially serious warning signs. Seek immediate professional medical assistance.'}[result.st];
return `<h2>CarePulse AI Assessment</h2><div class="status s-${result.st}" style="margin-top:16px"><div class="ring" style="background:conic-gradient(#fff ${result.s}%,#ffffff40 0)"><b style="color:var(--navy)">${result.s}</b></div><div style="flex:1;min-width:220px"><h2>${ico[result.st]} ${result.st}</h2><p>${m}</p></div></div>${result.st==='EMERGENCY'?`<div style="margin-top:14px"><p><b>Please seek professional medical assistance immediately.</b></p><div class="grid g2"><button class="btn r" onclick="call('Emergency Services')">Call Emergency Services</button><button class="btn r" onclick="reqAmb(AMB[0][0])">Request Ambulance</button><button class="btn o" onclick="go('/hospitals')">Find Nearest Hospital</button><button class="btn o" onclick="go('/nurses')">Contact Health Team</button></div></div>`:`<div class="row" style="margin-top:14px"><button class="btn" onclick="go('/history')">View history</button>${result.st==='CAUTIOUS'?'<button class="btn g" onclick="go(\'/nurses\')">Contact a nurse</button>':''}</div>`}<p class="dis">CarePulse AI provides decision support and does not replace professional medical diagnosis or emergency services.</p>`}
let filt='All';
function history(){const L=S.checks.filter(c=>filt==='All'||c.st===filt.toUpperCase());const pts=[...S.checks].reverse();const W=600,H=140;const xy=pts.map((c,i)=>[20+i*(W-40)/Math.max(1,pts.length-1),H-15-(c.score/100)*(H-30)]);
return `<h2>Health History</h2><div class="card" style="margin:14px 0"><b>Health score trend</b><svg viewBox="0 0 ${W} ${H}" style="width:100%"><polyline fill="none" stroke="var(--blue)" stroke-width="3" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${col[pts[i].st]}"/>`).join('')}</svg></div><div class="opt" style="margin-bottom:14px">${['All','Safe','Cautious','Emergency'].map(f=>`<button class="${filt===f?'on':''}" onclick="filt='${f}';render()">${f}</button>`).join('')}</div><div class="tl">${L.map(c=>`<div class="card" style="padding:14px"><div class="row sp"><b>${c.d} · ${c.t}</b>${pill(c.st)}</div><div class="mut">Symptoms: ${c.sym}<br>Score: ${c.score}${c.n?'<br>Notes: '+c.n:''}</div></div>`).join('')||'<p class="mut">No checks match this filter. Start a new health check.</p>'}</div>`}
function settings(){return `<h2>Settings</h2><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Account</h3><label>Name</label><input value="${S.user.name}"><label>Email</label><input value="${S.email}"><label>Phone</label><input value="+92 300 5550000"></div><div class="card"><h3>Health profile</h3><label>Medical information</label><textarea rows="2">Mild asthma</textarea><label>Emergency contact</label><input value="Omar Khan +92 300 5550001"></div><div class="card"><h3>Notifications</h3>${['Health reminders','Checkup reminders','Emergency notifications'].map(x=>`<label class="row" style="font-weight:500"><input type="checkbox" checked style="width:auto"> ${x}</label>`).join('')}</div><div class="card"><h3>Privacy & Security</h3><p class="mut">Your health information is handled securely and is only used to provide personalized health assistance.</p><button class="btn o s" onclick="toast('Password reset email sent (demo)')">Account security</button></div></div><div class="row" style="margin-top:16px"><button class="btn g" onclick="toast('Settings saved')">Save changes</button><button class="btn r" onclick="S.role=null;go('/')">Logout</button></div>`}

/* ---------- team ---------- */
function tDash(){const done=S.sched.filter(x=>x.s==='Completed').length;
return `<h2>Health Team Dashboard</h2><p class="mut">Welcome back, ${S.user.name}</p><div class="grid g5" style="margin:16px 0">${[['Assigned patients',PAT.length],['Today\'s checkups',S.sched.length],['Completed',done],['Pending',S.sched.filter(x=>x.s==='Pending').length],['Critical alerts',S.alerts.filter(a=>a.c==='Emergency').length]].map(([l,v],i)=>`<div class="card" style="padding:16px"><div class="mut">${l}</div><b style="font-size:30px;color:${i===4?'var(--red)':'var(--navy)'}">${v}</b></div>`).join('')}</div><h3 style="margin-bottom:10px">Patients</h3>${patList()}`}
const patList=()=>`<div class="grid g2">${PAT.map((p,i)=>`<div class="card"><div class="row sp"><h3>${p[0]}</h3>${pill(p[7])}</div><p class="mut">Age ${p[1]} · Priority ${p[9]}<br>Last check: 1 hr ago · Next: ${i%2?'12:00 PM':'11:00 AM'}<br>Assigned nurse: ${p[8]}</p><button class="btn s" onclick="openPat(${i})">Open patient</button></div>`).join('')}</div>`;
let cp=0;function openPat(i){cp=i;go('/t/patient')}
function tPat(){const p=PAT[cp];return `<button class="btn o s" onclick="go('/t/patients')">← Patients</button><h2 style="margin-top:12px">${p[0]}</h2><div class="grid g2" style="margin:14px 0"><div class="card"><h3>Patient overview</h3><p class="mut">Age ${p[1]} · ${p[2]} · Blood ${p[3]}<br>Allergies: ${p[4]}<br>Conditions: ${p[5]}<br>Medications: ${p[6]}<br>Emergency contact: Family member +92 300 5550123</p></div><div class="card"><h3>Current health status</h3><div style="font-size:26px;margin:10px 0">${ico[p[7]]} ${pill(p[7])}</div></div></div><div class="card"><h3>Hourly checkup</h3><div class="form2">${[['Temperature (°C)','36.8'],['Blood pressure','120/80'],['Heart rate (bpm)','74'],['Oxygen saturation (%)','97'],['Respiratory rate','16'],['Pain level (0–10)','2']].map(([l,v])=>`<div><label>${l}</label><input value="${v}"></div>`).join('')}</div><label>Symptoms</label><input><label>Notes</label><textarea rows="2"></textarea><button class="btn g" style="margin-top:14px" onclick="toast('Checkup completed for ${p[0]}')">Complete checkup</button></div>`}
function tSched(){return `<div class="row sp"><div><h2>Checkup Schedule</h2><p class="mut">Muhammad Ahmed · today</p></div><button class="btn g" onclick="schedForm(-1)">Add checkup</button></div><div class="tl" style="margin-top:14px">${S.sched.map((x,i)=>`<div class="card" style="padding:14px"><div class="row sp"><div><b>${x.t}</b> · ${x.k}</div>${pill(x.s)}</div><div class="row" style="margin-top:8px"><button class="btn s" onclick="S.sched[${i}].s='Completed';toast('Marked completed');render()">Complete</button><button class="btn o s" onclick="schedForm(${i})">Edit</button><button class="btn o s" onclick="S.sched.splice(${i},1);toast('Checkup deleted');render()">Delete</button></div></div>`).join('')}</div><p class="mut">Reminder: next pending checkup starts within the hour.</p>`}
function schedForm(i){const x=i>=0?S.sched[i]:{t:'02:00 PM',k:'General Check'};modal(`<h3>${i>=0?'Edit':'Add'} checkup</h3><label>Time</label><input id="f1" value="${x.t}"><label>Type</label><select id="f2">${['Blood Pressure','General Check','Medication Check','Temperature','Oxygen Check'].map(k=>`<option ${k===x.k?'selected':''}>${k}</option>`).join('')}</select><label>Notes</label><input><label class="row" style="font-weight:500"><input type="checkbox" style="width:auto"> Repeat hourly</label><button class="btn g" style="margin-top:12px" id="fs">Save checkup</button>`);
document.getElementById('fs').onclick=()=>{const o={t:$('#f1').value,k:$('#f2').value,s:'Pending'};if(i>=0)S.sched[i]={...S.sched[i],t:o.t,k:o.k};else S.sched.push(o);document.querySelector('.modal').remove();toast('Checkup saved');render()}}
function tAlerts(){const o={Emergency:0,Caution:1,Normal:2};return `<h2>Alert Center</h2><div style="margin-top:14px">${[...S.alerts].sort((a,b)=>o[a.c]-o[b.c]).map(a=>`<div class="card" style="margin-bottom:12px;${a.c==='Emergency'?'border-color:var(--red)':''}"><div class="row sp"><b>${a.c==='Emergency'?'🔴':a.c==='Caution'?'🟠':'🟢'} ${a.c} Alert</b>${pill(a.c)}</div><p>${a.m}</p><div class="row"><button class="btn s" onclick="openPat(0)">View patient</button>${a.c==='Emergency'?'<button class="btn r s" onclick="call(\'Emergency\')">Call Emergency</button>':''}<button class="btn o s" onclick="toast('Message sent to nurse')">Contact nurse</button></div></div>`).join('')}</div>`}
function tHist(){return `<h2>Patient History</h2><div class="grid g2" style="margin-top:14px">${PAT.map(p=>`<div class="card"><b>${p[0]}</b><div class="mut">Last 24 h: BP 128/82, HR 76, SpO₂ 96%</div>${pill(p[7])}</div>`).join('')}</div>`}
function tMsg(){return `<h2>Messages</h2><div class="card" style="margin-top:14px"><p><b>Dr. Demo:</b> Please recheck Hina Raza's SpO₂ at noon.</p><p><b>You:</b> Noted, will do.</p><div class="row"><input id="mi" placeholder="Write a message" style="flex:1"><button class="btn" onclick="toast('Message sent')">Send</button></div></div>`}

/* ---------- router ---------- */
const user_routes={dashboard:dash,check,history,hospitals,ambulances,nurses,notifications:notifs,settings,result:resultV};
const team_routes={'t/dashboard':tDash,'t/patients':()=>`<h2>Patients</h2><div style="margin-top:14px">${patList()}</div>`,'t/patient':tPat,'t/schedule':tSched,'t/alerts':tAlerts,'t/history':tHist,'t/messages':tMsg,settings};
function render(){const r=(location.hash.replace(/^#\/?/,'')||'').split('#')[0];const app=$('#app');
const pub={'':landing,start,'profile-setup':profileSetup,'team-register':teamReg,emergency:emergencyPub};
if(r in pub){window._lr=null;app.innerHTML=pub[r]();if(r==='start')bindStart();
if(r==='profile-setup')$('#sv').onclick=()=>{const n=$('#p1').value.trim();if(!n){return $('#er').textContent='Enter your full name to save your profile.'}S.user={name:n};toast('Profile saved');go('/dashboard')};
if(r==='team-register')$('#tr').onclick=()=>modal('<h3>Verification Pending</h3><p class="mut">Thank you. Your certification will be reviewed. You will not appear as Verified until review is complete.</p>');return}
if(!S.role){S.role='user';S.email=S.email||'demo@carepulse.demo'}
const map=S.role==='team'?team_routes:user_routes;const f=map[r];
if(!f){go(S.role==='team'?'/t/dashboard':'/dashboard');return}
if(window._lr===r){app.innerHTML=shell(r,f());return}window._lr=r;app.innerHTML=shell(r,'<div class="skel"></div>');setTimeout(()=>{if((location.hash.replace(/^#\/?/,''))===r){app.innerHTML=shell(r,f())}},150)}
addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});render();
</script></body></html>
